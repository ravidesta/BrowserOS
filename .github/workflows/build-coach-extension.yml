name: Build Coach Extension

on:
  push:
    branches:
      - "claude/**"
      - "feat/**"
      - "fix/**"
    paths:
      - "packages/browseros-agent/apps/agent/**"
      - "packages/browseros-agent/packages/shared/**"
      - "packages/browseros-agent/apps/server/**"
      - ".github/workflows/build-coach-extension.yml"
  pull_request:
    paths:
      - "packages/browseros-agent/apps/agent/**"
      - "packages/browseros-agent/packages/shared/**"
      - "packages/browseros-agent/apps/server/**"
      - ".github/workflows/build-coach-extension.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/browseros-agent
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate GraphQL types
        working-directory: packages/browseros-agent/apps/agent
        run: bun --env-file=.env.development run codegen

      - name: Typecheck
        run: bun run --filter '@browseros/agent' typecheck

      - name: Lint
        working-directory: packages/browseros-agent/apps/agent
        run: bunx biome check

      - name: Build and zip extension
        working-directory: packages/browseros-agent/apps/agent
        env:
          VITE_PUBLIC_BROWSEROS_API: https://api.browseros.com
        run: bun run zip

      - name: Resolve artifact path
        id: artifact
        working-directory: packages/browseros-agent/apps/agent
        run: |
          ZIP_FILE=$(ls "$(pwd)/dist/"*-chrome.zip | head -n 1)
          BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          ARTIFACT_NAME="coach-extension-${BRANCH}-${SHORT_SHA}"
          echo "zip_path=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.zip_path }}
          retention-days: 30
          if-no-files-found: error
